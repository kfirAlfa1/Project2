services:
  gui:
    build:
      context: .
      dockerfile: .base44/Dockerfile.gui
    working_dir: /app/src
    volumes:
      - ./:/app
    ports:
      - "3000:6080"
    environment:
      - DISPLAY=:99
    restart: on-failure
    command:
      - sh
      - -ec
      - |
        Xvfb :99 -screen 0 1024x700x24 &
        sleep 1
        fluxbox >/dev/null 2>&1 &
        x11vnc -display :99 -forever -shared -nopw -quiet &
        echo '<meta http-equiv="refresh" content="0;url=vnc.html?autoconnect=1&resize=scale">' > /usr/share/novnc/index.html
        # Relaunch the GUI whenever the user closes it (picks up code edits)
        (while true; do python gui.py || true; sleep 1; done) &
        exec websockify --web /usr/share/novnc 6080 localhost:5900
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6080/vnc.html >/dev/null && pgrep -f 'python gui.py' >/dev/null || (echo 'novnc or gui down'; exit 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
